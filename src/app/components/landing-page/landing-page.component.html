<div class="flex flex-col" >
    <div *ngFor="let doodle of doodles" class="p-2">
            <div class=" border-2 border-indigo-500"  >
                <p>{{doodle.doodlr}} &#9679; {{doodle.created_on}} </p>
                <p class="border-2 border-orange-500">{{doodle.title}}</p>
                <a [routerLink]="['/doodle', doodle!.id]"> <img src="{{doodle.image}}" class="border-2 border-rose-500" /> </a>
                <div class="flex flex-row justify-center space-x-2 border-2 border-lime-500 ">
                <div *ngFor="let yeah of doodle.yeahs">
                    <p>{{yeah.type}}: {{yeah.count}}</p>
                </div>
                <p>{{doodle.number_of_comments}} comments</p>
                </div>
            </div>
    </div>
</div>

 

<div *ngIf="!doodles" class="m-auto">
        <p>there are no doodles, get to drawing!!</p>
</div>
