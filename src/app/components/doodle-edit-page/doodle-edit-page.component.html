<div class="py-[5%] text-center  " >
    <input (change)="changeTitle($event)" type="text" name="doodle-title" id="doodle-title" placeholder="{{doodle?.title}}" class="underline" />

    <div class="flex justify-center" >
        <img class="border border-lime-500" src="{{doodle?.image}}" alt="doodle">
    </div>

    <button class="cursor-pointer bg-blue-400 rounded p-[1%] text-white hover:bg-blue-500 " (click)="patchDoodle()" >edit</button>
</div>
