<div class="text-center py-[1%]">
    <div>
        <input (change)="grabTitle($event)" type="text" placeholder="title the doodle (optional)" class=" text-xl underline decoration-blue-500 hover:no-underline">
    </div>

    <div class="flex justify-center py-5">
        <canvas id="canvas" width="640" height="240"  class="border-solid content-center bg-slate-100">
            your browser does not support the canvas element
        </canvas>
    </div>

    <div class="flex space-x-[5%] justify-center">
        <button (click)="clearCanvas()" id="clear" class="cursor-pointer bg-blue-400 rounded p-[1%] text-white hover:bg-blue-500"> clear </button>
        <button (click)="postDoodl()" id="post" class="cursor-pointer bg-blue-400 rounded p-[1%] text-white hover:bg-blue-500 " > post </button>
    </div>
</div>
