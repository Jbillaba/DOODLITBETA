<div class="text-center max-w-[50%]" >
  <input type="textbox" class="searchbar" (change)="grabQuery()">


  <div class="modal">

    <div class="modal__inner" >
      <h1>list of results</h1>
      <div *ngFor="let result of results"  >
        {{result.title || result.username}}
      </div>
    </div>
  </div>

</div>
